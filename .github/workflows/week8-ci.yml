name: Week 8 Flutter CI

on:
  pull_request:
    paths:
      - "08-week-8-mid-project-review/**"
      - ".github/workflows/week8-ci.yml"
  push:
    paths:
      - "08-week-8-mid-project-review/**"
      - ".github/workflows/week8-ci.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 08-week-8-mid-project-review/week5_offline_notes
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart format --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
